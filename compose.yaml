services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: maison_vale_dev
      POSTGRES_USER: maison_vale
      POSTGRES_PASSWORD: maison_vale_local
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maison_vale -d maison_vale_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - maison_vale_postgres_data:/var/lib/postgresql/data

volumes:
  maison_vale_postgres_data:
